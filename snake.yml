name: 🐍 Generate Snake Animation

on:
  # Executa duas vezes por dia
  schedule:
    - cron: "0 0,12 * * *"

  # Permite executar manualmente
  workflow_dispatch:

  # Executa quando houver alterações na branch principal
  push:
    branches:
      - master

jobs:
  generate:
    name: Generate Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: 🐍 Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark

      - name: 🚀 Publish snake.svg
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
